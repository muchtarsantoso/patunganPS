<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DKriuk PS Championship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            position: relative;
        }

        /* BACKGROUND LOGO KLUB SEPAKBOLA ACAK */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            opacity: 0.08; /* Transparansi rendah agar teks tetap terbaca jelas */
            pointer-events: none; /* Agar tidak menghalangi tombol saat diklik */
            background-image: 
                url('https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg'),
                url('https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg'),
                url('https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg'),
                url('https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg'),
                url('https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg'),
                url('https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg'),
                url('https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg'),
                url('https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_of_AC_Milan.svg'),
                url('https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg');
            background-position: 
                5% 10%, 85% 5%, 15% 45%, 85% 40%, 50% 25%, 75% 75%, 20% 85%, 50% 90%, 45% 60%;
            background-size: 
                140px, 130px, 150px, 140px, 160px, 150px, 140px, 120px, 110px;
            background-repeat: no-repeat;
        }

        .gaming-gradient { background: linear-gradient(135deg, #ef4444 0%, #f97316 100%); }
        .gaming-text {
            background: linear-gradient(135deg, #f87171 0%, #fb923c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-center items-center">
            <h1 class="text-2xl font-bold gaming-text flex items-center gap-2">
                <i class="fa-solid fa-gamepad"></i> DKriuk PS Championship
            </h1>
        </div>
        <!-- Tabs -->
        <div class="flex max-w-md mx-auto border-b border-slate-800 text-sm sm:text-base">
            <button id="tab-sesi" class="flex-1 py-3 text-center font-semibold text-orange-400 border-b-2 border-orange-500 transition-colors" onclick="switchTab('sesi')">
                <i class="fa-solid fa-stopwatch block sm:inline mb-1 sm:mb-0"></i> Sesi Aktif
            </button>
            <button id="tab-riwayat" class="flex-1 py-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition-colors" onclick="switchTab('riwayat')">
                <i class="fa-solid fa-clock-rotate-left block sm:inline mb-1 sm:mb-0"></i> Riwayat
            </button>
            <button id="tab-klasemen" class="flex-1 py-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition-colors" onclick="switchTab('klasemen')">
                <i class="fa-solid fa-trophy block sm:inline mb-1 sm:mb-0"></i> Klasemen
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4">
        
        <!-- ================= VIEW: SESI AKTIF ================= -->
        <div id="view-sesi" class="space-y-6 block">
            <div id="sesi-loading" class="text-center py-10 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2"></i><p>Memuat sesi...</p>
            </div>

            <!-- Start Session -->
            <div id="sesi-start-container" class="hidden text-center py-10">
                <div class="w-24 h-24 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-orange-500/20">
                    <i class="fa-solid fa-power-off text-4xl text-slate-400"></i>
                </div>
                <h2 class="text-xl font-bold mb-2">Belum Ada Sesi Main</h2>
                <button onclick="startNewSession()" class="gaming-gradient hover:opacity-90 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 mt-4">
                    <i class="fa-solid fa-play mr-2"></i> Mulai Sesi Baru
                </button>
            </div>

            <!-- Active Session Area -->
            <div id="sesi-active-container" class="hidden space-y-4">
                
                <!-- EDIT TANGGAL SESI AKTIF -->
                <div class="text-center bg-slate-800/80 rounded-xl p-3 border border-slate-700 relative overflow-hidden shadow-lg">
                    <label class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1 font-bold">Tanggal Sesi Aktif</label>
                    <div class="relative w-full flex justify-center">
                        <input type="date" id="active-session-date" onchange="updateSessionDate('current_active', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div class="font-bold text-lg text-orange-400 flex items-center gap-2 pointer-events-none">
                            <span id="active-session-title-text">Sesi Hari Ini</span>
                            <i class="fa-solid fa-calendar-days text-sm text-slate-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Tambah Pemain -->
                <div class="bg-slate-800/90 rounded-2xl p-4 shadow-lg border border-slate-700">
                    <h3 class="font-bold text-sm text-slate-400 mb-3 uppercase tracking-wider">Tambah Pemain</h3>
                    <div class="flex gap-2">
                        <datalist id="default-players">
                            <option value="Jun"></option><option value="Muchtar"></option>
                            <option value="Ekky"></option><option value="Ramdan"></option>
                            <option value="Rendy"></option><option value="Widi"></option>
                        </datalist>
                        <input type="text" list="default-players" id="new-player-name" placeholder="Pilih / Ketik Nama..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-orange-500 transition-colors">
                        <button onclick="openAddPlayerModal()" class="bg-orange-600 hover:bg-orange-500 text-white rounded-xl px-4 py-2 font-bold transition-colors">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Player List Container -->
                <div id="player-list-current_active" class="space-y-3"></div>

                <!-- Control Buttons -->
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <button onclick="showReviewModal('current_active')" class="bg-blue-600/90 hover:bg-blue-500 text-white font-bold py-3 px-2 rounded-xl text-sm transition-colors shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-eye"></i> Review Sementara
                    </button>
                    <button onclick="stopAllTimers()" class="bg-slate-700/90 hover:bg-slate-600 text-white font-bold py-3 px-2 rounded-xl text-sm transition-colors shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-stop"></i> Selesaikan Sesi
                    </button>
                </div>

                <!-- Total Bill Settings -->
                <div class="bg-slate-800/90 rounded-2xl p-4 shadow-lg border border-slate-700 mt-6">
                    <h3 class="font-bold text-sm text-slate-400 mb-3 uppercase tracking-wider">Hitung Final & Simpan</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Total Biaya Sewa Keseluruhan (Rp)</label>
                            <div class="relative">
                                <span class="absolute left-3 top-2 text-slate-400">Rp</span>
                                <input type="number" id="total-sewa" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-white focus:outline-none focus:border-orange-500 transition-colors text-lg font-bold" placeholder="0" onchange="updateTotalSewa('current_active', this.value)">
                            </div>
                        </div>
                        <button onclick="showFinalizeModal()" class="w-full gaming-gradient hover:opacity-90 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check-double"></i> Hitung & Simpan Sesi
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= VIEW: RIWAYAT ================= -->
        <div id="view-riwayat" class="hidden space-y-4">
            <h2 class="font-bold text-lg text-slate-300 text-center mb-4">Riwayat Sesi</h2>
            <div id="riwayat-list" class="space-y-4">
                <!-- Diisi oleh JS -->
            </div>
        </div>

        <!-- ================= VIEW: KLASEMEN ================= -->
        <div id="view-klasemen" class="hidden space-y-4">
            <div class="bg-slate-800/90 rounded-2xl overflow-hidden border border-slate-700 shadow-lg">
                <div class="p-4 bg-slate-900/50 border-b border-slate-700 flex justify-between items-center">
                    <h2 class="font-bold text-lg"><i class="fa-solid fa-ranking-star text-yellow-500 mr-2"></i> Hall of Fame</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse backdrop-blur-sm">
                        <thead>
                            <tr class="bg-slate-800/80 text-xs text-slate-400 uppercase tracking-wider">
                                <th class="p-3 pl-4 w-10 text-center">#</th>
                                <th class="p-3">Pemain</th>
                                <th class="p-3 text-center"><i class="fa-solid fa-crown text-yellow-500" title="Juara Sesi"></i></th>
                                <th class="p-3 text-center"><i class="fa-solid fa-trophy text-slate-300" title="Total Trofi"></i></th>
                            </tr>
                        </thead>
                        <tbody id="klasemen-list" class="divide-y divide-slate-700/50 text-sm">
                            <tr><td colspan="4" class="text-center py-8 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin mb-2 block"></i> Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: Confirm Add Player Time -->
    <div id="modal-add-time" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex flex-col justify-center items-center p-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden border border-slate-700 p-6">
            <h2 class="text-xl font-bold text-center mb-1">Waktu Mulai</h2>
            <p class="text-center text-slate-400 text-sm mb-6" id="add-player-display-name"></p>
            
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 mb-6 flex flex-col items-center">
                <label class="text-xs text-slate-400 mb-2 uppercase font-bold tracking-wider">Atur Jam (Opsional)</label>
                <input type="time" id="add-player-time-input" class="bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-xl text-white focus:border-orange-500 outline-none text-center w-full">
            </div>

            <div class="space-y-3">
                <button onclick="confirmAddPlayer()" class="w-full py-3 rounded-xl font-bold gaming-gradient text-white shadow-lg shadow-orange-500/30">
                    <i class="fa-solid fa-check mr-1"></i> Simpan
                </button>
                <button onclick="closeAddPlayerModal()" class="w-full py-3 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 text-white transition-colors">
                    Batal
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Receipt / Struk -->
    <div id="modal-result" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex flex-col justify-end sm:justify-center items-center">
        <div class="bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-center mb-1" id="modal-receipt-title">Struk Patungan</h2>
                <p class="text-center text-slate-400 text-sm mb-6" id="modal-date-info">Sesi Hari Ini</p>

                <div class="space-y-4 max-h-[50vh] overflow-y-auto hide-scrollbar mb-6" id="receipt-list">
                    <!-- Populated by JS -->
                </div>

                <div class="border-t border-slate-700 pt-4 mb-6">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-slate-400 text-sm">Total Waktu Main Sesi</span>
                        <span class="font-bold text-slate-200" id="receipt-total-time">0j 0m</span>
                    </div>
                    <div class="flex justify-between items-center text-lg mt-2 pt-2 border-t border-slate-700/50">
                        <span class="text-slate-300 font-medium">Total Tagihan</span>
                        <span class="font-bold text-orange-400" id="receipt-total-collected">Rp 0</span>
                    </div>
                </div>

                <div class="flex gap-3" id="receipt-buttons">
                    <!-- Diisi dinamis oleh JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-full shadow-2xl z-[150] opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2">
        <i id="toast-icon" class="fa-solid fa-info-circle text-orange-400"></i>
        <span id="toast-msg" class="text-sm font-medium">Message</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCNcZD9LkFhDjgli7AxlcyXPdIgU55j50",
            authDomain: "patungan-ps.firebaseapp.com",
            projectId: "patungan-ps",
            storageBucket: "patungan-ps.firebasestorage.app",
            messagingSenderId: "366357148263",
            appId: "1:366357148263:web:fdc6432040c19eaaa69ac2"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allSessions = [];
        let activeSession = null;
        let historySessions = [];
        let clockInterval = null;
        let pendingPlayerName = "";

        // UI Tabs
        window.switchTab = (tab) => {
            ['sesi', 'riwayat', 'klasemen'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                let btn = document.getElementById(`tab-${t}`);
                btn.classList.remove('text-orange-400', 'border-orange-500');
                btn.classList.add('text-slate-400', 'border-transparent');
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            let activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('text-orange-400', 'border-orange-500');
            activeBtn.classList.remove('text-slate-400', 'border-transparent');
        };

        // Utility Formats
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
        
        const formatTimeInput = (timestamp) => {
            if (!timestamp) return '';
            const d = new Date(timestamp);
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        };

        const calculateDurationMin = (start, end) => {
            if (!start) return 0;
            return Math.floor(((end || Date.now()) - start) / 60000);
        };

        const formatDuration = (minutes) => {
            if (minutes < 0) return '0m';
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return h > 0 ? `${h}j ${m}m` : `${m}m`;
        };

        const generateTrophies = (count) => {
            if(!count || count <= 0) return '0';
            return `${count} <span class="text-xs ml-1">${'🏆'.repeat(count)}</span>`;
        };

        // Mengubah YYYY-MM-DD menjadi "Sesi Hari, Tanggal Bulan Tahun"
        const formatDateToTitle = (dateString) => {
            if (!dateString) return 'Sesi Baru';
            const d = new Date(dateString);
            return `Sesi ${d.toLocaleDateString('id-ID', {weekday: 'long', day:'numeric', month:'short', year:'numeric'})}`;
        };

        window.showToast = (msg, type='info') => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
        };

        // Listen to all sessions from DB
        onSnapshot(collection(db, 'ps_sessions'), (snapshot) => {
            document.getElementById('sesi-loading').classList.add('hidden');
            allSessions = [];
            activeSession = null;
            historySessions = [];
            
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.isActive && docSnap.id === 'current_active') {
                    activeSession = { id: docSnap.id, ...data };
                } else if (!data.isActive && docSnap.id !== 'current_active' && data.players) {
                    historySessions.push({ id: docSnap.id, ...data });
                }
            });

            historySessions.sort((a,b) => parseInt(b.id) - parseInt(a.id));

            renderMainActiveSession();
            renderHistoryTab();
            computeAndRenderLeaderboard();
        });

        // ---------------- Sesi Aktif Logic ----------------
        window.startNewSession = async () => {
            try {
                // Buat tanggal standar hari ini YYYY-MM-DD
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const sessionDate = `${yyyy}-${mm}-${dd}`;
                const dateTitle = formatDateToTitle(sessionDate);

                await setDoc(doc(db, 'ps_sessions', 'current_active'), {
                    isActive: true, 
                    title: dateTitle, 
                    sessionDate: sessionDate, // Simpan format raw untuk date picker
                    totalSewa: 0, 
                    players: []
                });
                showToast("Sesi baru dimulai!", "success");
            } catch (error) { showToast("Gagal memulai sesi", "error"); }
        };

        window.openAddPlayerModal = () => {
            const name = document.getElementById('new-player-name').value.trim();
            if (!name) return showToast("Nama pemain tidak boleh kosong", "error");
            if (activeSession && activeSession.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
                return showToast("Pemain sudah ada. Klik 'Mulai Lagi' di kartunya.", "error");
            }
            pendingPlayerName = name;
            document.getElementById('add-player-display-name').innerText = name;
            
            const now = new Date();
            document.getElementById('add-player-time-input').value = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            document.getElementById('modal-add-time').classList.remove('hidden');
        };

        window.closeAddPlayerModal = () => { document.getElementById('modal-add-time').classList.add('hidden'); };

        window.confirmAddPlayer = async () => {
            if (!activeSession) return;
            const timeStr = document.getElementById('add-player-time-input').value;
            let startTime = Date.now();
            
            if (timeStr) {
                let dateObj = new Date();
                let [hours, minutes] = timeStr.split(':');
                dateObj.setHours(parseInt(hours), parseInt(minutes), 0);
                startTime = dateObj.getTime();
            }

            const newPlayer = {
                id: 'p_' + Date.now(),
                name: pendingPlayerName,
                timeLogs: [{ start: startTime, end: null }],
                trophies: 0,
                isActive: true
            };

            try {
                await updateDoc(doc(db, 'ps_sessions', 'current_active'), { 
                    players: [...activeSession.players, newPlayer] 
                });
                document.getElementById('new-player-name').value = '';
                closeAddPlayerModal();
                showToast(`${pendingPlayerName} ditambahkan!`, "success");
            } catch (error) { showToast("Gagal menambah", "error"); }
        };

        // ---------------- Generic CRUD for any session ----------------
        
        // FUNGSI UPDATE TANGGAL SESI DARI DATE PICKER
        window.updateSessionDate = async (sessionId, newDateStr) => {
             if (!newDateStr) return;
             try {
                 const title = formatDateToTitle(newDateStr); // Otomatis format: Sesi Kamis, 8 Okt...
                 await updateDoc(doc(db, 'ps_sessions', sessionId), { 
                     sessionDate: newDateStr, 
                     title: title 
                 });
                 showToast("Tanggal sesi berhasil diperbarui", "success");
             } catch (error) { showToast("Gagal mengubah tanggal sesi", "error"); }
        };

        window.togglePlayStatus = async (sessionId, playerId, action) => {
             const session = sessionId === 'current_active' ? activeSession : historySessions.find(s => s.id === sessionId);
             if (!session) return;
             const updatedPlayers = session.players.map(p => {
                 if (p.id === playerId) {
                     let logs = p.timeLogs || [];
                     if (action === 'stop') {
                         logs = logs.map(l => l.end === null ? { ...l, end: Date.now() } : l);
                         return { ...p, timeLogs: logs, isActive: false };
                     } else if (action === 'start') {
                         logs.push({ start: Date.now(), end: null });
                         return { ...p, timeLogs: logs, isActive: true };
                     }
                 }
                 return p;
             });
             await updateDoc(doc(db, 'ps_sessions', sessionId), { players: updatedPlayers });
        };

        window.updateTimeLog = async (sessionId, playerId, logIndex, field, timeString) => {
            const session = sessionId === 'current_active' ? activeSession : historySessions.find(s => s.id === sessionId);
            if (!session) return;
            const updatedPlayers = session.players.map(p => {
                if (p.id === playerId) {
                    let logs = [...p.timeLogs];
                    let log = {...logs[logIndex]};
                    if (timeString) {
                        let dateObj = new Date(log[field] || Date.now());
                        let [hours, minutes] = timeString.split(':');
                        dateObj.setHours(parseInt(hours), parseInt(minutes), 0);
                        log[field] = dateObj.getTime();
                    } else if (field === 'end') { log[field] = null; }
                    logs[logIndex] = log;
                    return { ...p, timeLogs: logs, isActive: logs.some(l => l.end === null) };
                }
                return p;
            });
            await updateDoc(doc(db, 'ps_sessions', sessionId), { players: updatedPlayers });
        };

        window.updateTrophy = async (sessionId, playerId, delta) => {
            const session = sessionId === 'current_active' ? activeSession : historySessions.find(s => s.id === sessionId);
            if (!session) return;
            const updatedPlayers = session.players.map(p => {
                 if (p.id === playerId) return { ...p, trophies: Math.max(0, (p.trophies || 0) + delta) };
                 return p;
             });
            await updateDoc(doc(db, 'ps_sessions', sessionId), { players: updatedPlayers });
        };

        window.updateTotalSewa = async (sessionId, value) => {
             const total = parseInt(value) || 0;
             await updateDoc(doc(db, 'ps_sessions', sessionId), { totalSewa: total });
        };

        window.stopAllTimers = async () => {
            if (!activeSession) return;
            const updatedPlayers = activeSession.players.map(p => {
                let logs = (p.timeLogs||[]).map(l => l.end === null ? { ...l, end: Date.now() } : l);
                return { ...p, timeLogs: logs, isActive: false };
            });
            await updateDoc(doc(db, 'ps_sessions', 'current_active'), { players: updatedPlayers });
            showToast("Semua waktu pemain telah dihentikan", "success");
        };

        // ---------------- UI Renderers ----------------
        function renderMainActiveSession() {
            if (!activeSession) {
                document.getElementById('sesi-start-container').classList.remove('hidden');
                document.getElementById('sesi-active-container').classList.add('hidden');
                if(clockInterval) { clearInterval(clockInterval); clockInterval = null; }
                return;
            }
            document.getElementById('sesi-start-container').classList.add('hidden');
            document.getElementById('sesi-active-container').classList.remove('hidden');
            
            // Set value input tanggal sesi
            document.getElementById('active-session-date').value = activeSession.sessionDate || '';
            document.getElementById('active-session-title-text').innerText = activeSession.title || 'Sesi Hari Ini';
            
            document.getElementById('total-sewa').value = activeSession.totalSewa || '';
            document.getElementById('player-list-current_active').innerHTML = generatePlayerListHTML(activeSession, true);
            
            if(!clockInterval) clockInterval = setInterval(renderMainActiveSession, 60000); 
        }

        function generatePlayerListHTML(session, isActiveView) {
            if (!session.players || session.players.length === 0) {
                return `<div class="text-center py-6 text-slate-500 text-sm border border-dashed border-slate-700 rounded-xl">Belum ada pemain.</div>`;
            }
            let html = '';
            session.players.forEach((p) => {
                const logs = p.timeLogs || [];
                let totalDurationMins = 0;
                let isPlaying = logs.some(l => l.end === null);

                let logsHtml = '';
                logs.forEach((log, idx) => {
                    let dur = calculateDurationMin(log.start, log.end);
                    totalDurationMins += dur;
                    logsHtml += `
                    <div class="flex items-center gap-1 sm:gap-2 mt-2 bg-slate-900/80 p-2 rounded-lg border border-slate-700/50">
                        <input type="time" value="${formatTimeInput(log.start)}" onchange="updateTimeLog('${session.id}', '${p.id}', ${idx}, 'start', this.value)" class="bg-slate-800 border border-slate-600 rounded px-1 sm:px-2 py-1 text-xs sm:text-sm text-white focus:border-orange-500 outline-none w-20 sm:w-24 text-center">
                        <span class="text-slate-500">-</span>
                        <input type="time" value="${log.end ? formatTimeInput(log.end) : ''}" onchange="updateTimeLog('${session.id}', '${p.id}', ${idx}, 'end', this.value)" class="bg-slate-800 border border-slate-600 rounded px-1 sm:px-2 py-1 text-xs sm:text-sm text-white focus:border-orange-500 outline-none w-20 sm:w-24 text-center" ${!log.end ? 'placeholder="Main..."' : ''}>
                        <span class="text-xs text-slate-300 font-semibold ml-auto whitespace-nowrap">${formatDuration(dur)}</span>
                    </div>`;
                });
                
                html += `
                <div class="bg-slate-800/90 rounded-xl p-4 shadow-lg border ${isPlaying ? 'border-orange-500/50 shadow-orange-900/30' : 'border-slate-700 opacity-90'} transition-all mb-3 backdrop-blur-sm">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-2">
                            <h4 class="font-bold text-lg">${p.name}</h4>
                            ${isPlaying ? '<span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span>' : ''}
                        </div>
                        ${isPlaying ? `
                            <button onclick="togglePlayStatus('${session.id}', '${p.id}', 'stop')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition-colors"><i class="fa-solid fa-stop"></i> Selesai</button>
                        ` : `
                            <button onclick="togglePlayStatus('${session.id}', '${p.id}', 'start')" class="bg-green-500/20 text-green-400 hover:bg-green-500 hover:text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition-colors"><i class="fa-solid fa-play"></i> Mulai Lagi</button>
                        `}
                    </div>
                    <div class="mb-4">
                        ${logsHtml}
                        <div class="text-xs text-slate-400 mt-2 text-right w-full">Total Main: <span class="text-orange-400 font-bold">${formatDuration(totalDurationMins)}</span></div>
                    </div>
                    <div class="border-t border-slate-700/50 pt-3">
                        <div class="bg-slate-900/60 p-2 rounded-lg flex items-center justify-between">
                            <label class="text-[11px] text-slate-400 uppercase font-bold tracking-wider">Total Trofi Sesi</label>
                            <div class="flex items-center gap-3">
                                <button onclick="updateTrophy('${session.id}', '${p.id}', -1)" class="w-7 h-7 rounded-full bg-slate-700 hover:bg-slate-600 transition text-sm">-</button>
                                <span class="font-bold text-yellow-500 text-lg text-center" style="min-width:40px;">${generateTrophies(p.trophies)}</span>
                                <button onclick="updateTrophy('${session.id}', '${p.id}', 1)" class="w-7 h-7 rounded-full bg-slate-700 hover:bg-slate-600 transition text-sm">+</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            return html;
        }

        window.toggleHistoryDetails = (id) => {
            const el = document.getElementById(`hist-details-${id}`);
            el.classList.toggle('hidden');
        };

        function renderHistoryTab() {
            const listEl = document.getElementById('riwayat-list');
            if (historySessions.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-500">Belum ada riwayat sesi.</div>`;
                return;
            }
            let html = '';
            historySessions.forEach(session => {
                html += `
                <div class="bg-slate-800/90 rounded-2xl border border-slate-700 overflow-hidden shadow-lg backdrop-blur-sm">
                    <div class="p-4 bg-slate-900/50 flex justify-between items-center cursor-pointer hover:bg-slate-800 transition" onclick="toggleHistoryDetails('${session.id}')">
                        <div>
                            <h3 class="font-bold text-orange-400">${session.title}</h3>
                            <p class="text-xs text-slate-400 mt-1">${session.players.length} Pemain | Total Rp ${formatRupiah(session.totalSewa).replace('Rp','')}</p>
                        </div>
                        <i class="fa-solid fa-chevron-down text-slate-500"></i>
                    </div>
                    <div id="hist-details-${session.id}" class="hidden p-4 border-t border-slate-700 bg-slate-800/90">
                        
                        <!-- PENGATURAN TANGGAL & BIAYA RIWAYAT -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 bg-slate-900/60 p-3 rounded-xl border border-slate-700">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Ubah Tanggal Sesi</label>
                                <div class="relative bg-slate-800 border border-slate-700 rounded-xl overflow-hidden focus-within:border-orange-500 p-2 text-center h-10 flex items-center justify-center">
                                    <input type="date" value="${session.sessionDate || ''}" onchange="updateSessionDate('${session.id}', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                                    <div class="font-bold text-slate-200 text-sm flex items-center justify-center gap-2 pointer-events-none">
                                        <span>${session.title || 'Pilih Tanggal'}</span> <i class="fa-solid fa-calendar-days text-slate-500"></i>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Edit Total Biaya (Rp)</label>
                                <div class="flex items-center bg-slate-800 border border-slate-700 rounded-xl overflow-hidden focus-within:border-orange-500 h-10">
                                    <div class="pl-3 text-slate-500 text-sm">Rp</div>
                                    <input type="number" value="${session.totalSewa || 0}" onchange="updateTotalSewa('${session.id}', this.value)" class="w-full bg-transparent px-3 py-2 text-white outline-none text-sm font-bold">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2 mb-4">
                            ${generatePlayerListHTML(session, false)}
                        </div>
                        <button onclick="showReviewModal('${session.id}')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-colors text-sm shadow-md">
                            <i class="fa-solid fa-receipt"></i> Lihat Struk Sesi Ini
                        </button>
                    </div>
                </div>`;
            });
            listEl.innerHTML = html;
        }

        function computeAndRenderLeaderboard() {
            let stats = {};
            historySessions.forEach(session => {
                let maxT = 0;
                session.players.forEach(p => { if ((p.trophies||0) > maxT) maxT = p.trophies||0; });
                
                session.players.forEach(p => {
                    const name = p.name.trim();
                    if (!stats[name]) stats[name] = { name: name, trophies: 0, champs: 0 };
                    stats[name].trophies += (p.trophies || 0);
                    if (maxT > 0 && (p.trophies||0) === maxT) stats[name].champs += 1;
                });
            });

            const sorted = Object.values(stats).sort((a,b) => b.champs !== a.champs ? b.champs - a.champs : b.trophies - a.trophies);
            
            const listEl = document.getElementById('klasemen-list');
            if (sorted.length === 0) {
                listEl.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500">Belum ada data dari riwayat sesi.</td></tr>`;
                return;
            }

            let html = '';
            sorted.forEach((p, index) => {
                let rankStyle = index === 0 ? 'text-yellow-400 font-bold' : (index===1 ? 'text-slate-300 font-bold' : (index===2 ? 'text-amber-600 font-bold' : 'text-slate-400'));
                let rowBg = index === 0 ? 'bg-yellow-500/5' : '';
                html += `
                <tr class="${rowBg} hover:bg-slate-700/30 transition-colors">
                    <td class="p-3 pl-4 text-center ${rankStyle}">${index + 1}</td>
                    <td class="p-3 font-semibold">${p.name}</td>
                    <td class="p-3 text-center text-yellow-500 font-bold">${p.champs}</td>
                    <td class="p-3 text-center text-slate-300">${p.trophies}</td>
                </tr>`;
            });
            listEl.innerHTML = html;
        }

        // ---------------- Bill / Receipt Modal ----------------
        window.closeModal = () => { document.getElementById('modal-result').classList.add('hidden'); };

        window.showReviewModal = (sessionId) => { calculateAndShowModal(sessionId, false); };
        window.showFinalizeModal = () => { calculateAndShowModal('current_active', true); };

        function calculateAndShowModal(sessionId, isFinalizing) {
            const session = sessionId === 'current_active' ? activeSession : historySessions.find(s => s.id === sessionId);
            if (!session || session.players.length === 0) return showToast("Tidak ada pemain", "error");

            const totalSewa = session.totalSewa || 0;
            
            let globalMin = Infinity;
            let globalMax = 0;
            let totalIndividualMins = 0; 
            
            const tempPlayers = session.players.map(p => {
                let pDuration = 0;
                (p.timeLogs||[]).forEach(l => {
                    if (l.start < globalMin) globalMin = l.start;
                    let end = l.end || Date.now();
                    if (end > globalMax) globalMax = end;
                    pDuration += calculateDurationMin(l.start, l.end);
                });
                totalIndividualMins += pDuration;
                return { ...p, calcDuration: pDuration };
            });

            let overallSessionDuration = 0;
            if (globalMax > globalMin) overallSessionDuration = Math.floor((globalMax - globalMin) / 60000);

            let maxTrophy = -1;
            tempPlayers.forEach(p => { if ((p.trophies||0) > maxTrophy) maxTrophy = (p.trophies||0); });

            let totalBillSum = 0;
            let receiptHtml = '';
            
            tempPlayers.forEach(p => {
                let shareSewa = totalIndividualMins > 0 ? (p.calcDuration / totalIndividualMins) * totalSewa : 0;
                let totalBayar = Math.round(shareSewa);
                totalBillSum += totalBayar;
                
                const isChamp = maxTrophy > 0 && (p.trophies||0) === maxTrophy;
                receiptHtml += `
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <div>
                        <div class="font-bold flex items-center gap-1">${p.name} ${isChamp ? '<i class="fa-solid fa-crown text-yellow-500 text-xs ml-1"></i>' : ''}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${formatDuration(p.calcDuration)} main</div>
                    </div>
                    <div class="font-bold text-blue-400 text-right">
                        ${formatRupiah(totalBayar)}
                        <div class="text-[10px] text-slate-500 font-normal mt-0.5 text-right">${generateTrophies(p.trophies)}</div>
                    </div>
                </div>`;
            });

            document.getElementById('receipt-list').innerHTML = receiptHtml;
            document.getElementById('receipt-total-time').innerText = formatDuration(overallSessionDuration);
            document.getElementById('receipt-total-collected').innerText = formatRupiah(totalBillSum);
            document.getElementById('modal-receipt-title').innerText = isFinalizing ? "Hitung Final" : "Struk Sementara";
            document.getElementById('modal-date-info').innerText = session.title;

            let btns = `<button onclick="closeModal()" class="flex-1 py-3 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 transition-colors">Tutup</button>`;
            if (isFinalizing) {
                btns += `<button onclick="executeFinalizeSession()" class="flex-1 py-3 rounded-xl font-semibold gaming-gradient hover:opacity-90 text-white shadow-lg shadow-orange-500/30">SELESAI (Simpan)</button>`;
            }
            document.getElementById('receipt-buttons').innerHTML = btns;
            document.getElementById('modal-result').classList.remove('hidden');
        }

        window.executeFinalizeSession = async () => {
            if (!activeSession) return;
            try {
                const updatedPlayers = activeSession.players.map(p => {
                    let logs = (p.timeLogs||[]).map(l => l.end === null ? { ...l, end: Date.now() } : l);
                    return { ...p, timeLogs: logs, isActive: false };
                });
                
                const finalData = {
                    ...activeSession,
                    players: updatedPlayers,
                    isActive: false, 
                    endTime: Date.now() 
                };

                await setDoc(doc(db, 'ps_sessions', Date.now().toString()), finalData);
                await deleteDoc(doc(db, 'ps_sessions', 'current_active'));
                
                closeModal();
                showToast("Sesi berhasil disimpan ke riwayat!", "success");
            } catch (error) { showToast("Gagal menyimpan sesi final", "error"); }
        };
    </script>
</body>
</html>
